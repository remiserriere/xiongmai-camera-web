name: Docker image

on:
  push:
    branches: [main]
    tags: ["**"]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run --rm --entrypoint node "$IMAGE" -e '
            const { execFileSync } = require("node:child_process");
            execFileSync(require("ffmpeg-static"), ["-version"], { stdio: "inherit" });
          '
          docker run --detach --name camera-web-smoke \
            --env ALLOWED_HOSTS=camera.example.test \
            --publish 127.0.0.1:8080:8080 "$IMAGE"
          trap 'docker logs camera-web-smoke; docker rm --force camera-web-smoke' EXIT
          curl --fail --silent --show-error --retry 15 --retry-all-errors \
            --connect-timeout 2 --max-time 5 --retry-max-time 45 \
            --retry-delay 1 http://127.0.0.1:8080/api/status \
            | jq --exit-status '.ok == true and .connected == false'
          curl --fail --silent --show-error --header 'Host: camera.example.test' \
            http://127.0.0.1:8080/api/status \
            | jq --exit-status '.ok == true and .connected == false'
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Host: other.example.test' http://127.0.0.1:8080/api/status)
          echo "Unlisted host HTTP status: $status"
          test "$status" = 403

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$TAGS"
